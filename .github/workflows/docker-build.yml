name: Build and publish Docker image

on:
  push:
    branches:
      - claude/elegant-gauss-uw1ykh
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/phillipunzen/car-transport-software

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/claude/elegant-gauss-uw1ykh'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE_NAME@$IMAGE_DIGEST"
          docker buildx imagetools inspect "$IMAGE_NAME:latest"
          docker buildx imagetools inspect "$IMAGE_NAME:sha-$GITHUB_SHA"
          {
            echo "Image: $IMAGE_NAME:latest"
            echo "SHA tag: $IMAGE_NAME:sha-$GITHUB_SHA"
            echo "Digest: $IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
