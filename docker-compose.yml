# Startet App + MySQL. Konfiguration über eine .env-Datei (siehe .env.example).
#   docker compose up -d
# Mehrere App-Instanzen: STORAGE_DRIVER=s3 setzen und
#   docker compose up -d --scale app=3
# (dann einen Load-Balancer/Reverse-Proxy vor die Instanzen schalten)

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cartransport
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app-password-aendern}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-password-aendern}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root-password-aendern}"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    image: ghcr.io/phillipunzen/car-transport-software:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      codex:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: mysql://app:${MYSQL_PASSWORD:-app-password-aendern}@db:3306/cartransport
      AUTH_TRUST_HOST: "true"
      UPLOAD_DIR: /data/uploads
      CODEX_BRIDGE_URL: http://codex:3100
      CODEX_BRIDGE_SECRET: ${CODEX_BRIDGE_SECRET:-${AUTH_SECRET:?AUTH_SECRET muss gesetzt sein}}
    volumes:
      - uploads:/data/uploads

  # Private, shared Codex session. No app DB, uploads or API keys are mounted here.
  codex:
    image: ghcr.io/phillipunzen/car-transport-software:latest
    pull_policy: always
    restart: unless-stopped
    entrypoint: ["node", "/app/scripts/codex-bridge.mjs"]
    environment:
      CODEX_BRIDGE_SECRET: ${CODEX_BRIDGE_SECRET:-${AUTH_SECRET:?AUTH_SECRET muss gesetzt sein}}
      CODEX_APP_HOME: /data/codex
    volumes:
      - codex-session:/data/codex
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db-data:
  uploads:
  codex-session:
